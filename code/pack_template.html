<title>TripFlux Weekly Pack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: one column of video cards per day; thumbnail strip, three copy buttons, zip download. */
:root{--bg:#f3f6f9;--card:#ffffff;--fg:#10202e;--mute:#5b6b7a;--line:#d9e2ea;--accent:#0a8fe0;--accent-fg:#ffffff;--chip:#e5f3fc;--ok:#127a47;
--display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#15222f;--fg:#e8f0f6;--mute:#93a5b5;--line:#25384a;--accent:#38b2f5;--accent-fg:#06121c;--chip:#16364d;--ok:#4cc88a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#15222f;--fg:#e8f0f6;--mute:#93a5b5;--line:#25384a;--accent:#38b2f5;--accent-fg:#06121c;--chip:#16364d;--ok:#4cc88a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:4px 0 0}
h2{font-family:var(--display);font-size:18px;margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);padding:3px 8px;border-radius:4px}
.day{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.time{font:600 13px var(--body);background:var(--chip);padding:2px 8px;border-radius:4px;font-variant-numeric:tabular-nums}
.title{font-family:var(--display);font-size:17px;font-weight:700;margin:0;min-width:0;overflow-wrap:anywhere}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip a{flex:0 0 auto}
.strip img{display:block;height:170px;width:auto;border-radius:6px;border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 14px var(--body);border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.done{border-color:var(--ok);color:var(--ok)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--mute)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13.5px/1.5 var(--body);margin:10px 0 0;background:var(--bg);border-radius:6px;padding:12px}
.hint{color:var(--mute);font-size:13px;margin:0}
.empty{color:var(--mute)}
</style>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const VIDEOS=/*DATA*/[];
const app=document.getElementById('app');
const lon=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London'}).format(new Date());
const fmt=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
async function copy(btn,text){const old=btn.textContent;try{await navigator.clipboard.writeText(text);btn.textContent='Copied';btn.classList.add('done')}catch(e){const d=btn.closest('.card').querySelector('details[data-k="'+btn.dataset.k+'"]');if(d){d.open=true;btn.textContent='Select text below'}}setTimeout(()=>{btn.textContent=old;btn.classList.remove('done')},1800)}
async function zip(btn,v){const old=btn.textContent;btn.textContent='Preparing…';btn.disabled=true;
 try{const dl=await claude.use('downloads');if(!dl){btn.textContent='Not available here: press and hold a slide';btn.disabled=false;return}
  const z=new JSZip();for(const s of v.slides){const r=await fetch(s.full);z.file(s.name,await r.blob())}
  const blob=await z.generateAsync({type:'blob'});await dl.save({filename:v.date+'_'+v.time.replace(':','')+'_slides.zip',data:blob});btn.textContent='Saved'}
 catch(e){btn.textContent=(e&&e.code==='declined')?old:'Could not save: press and hold a slide'}
 btn.disabled=false;setTimeout(()=>btn.textContent=old,2500)}
function card(v){const c=el('section','card');const h=el('div','head');h.append(el('span','time',v.time),el('h3','title',v.title));c.append(h);
 const s=el('div','strip');v.slides.forEach((x,i)=>{const a=el('a');a.href=x.full;a.target='_blank';a.rel='noopener';const im=new Image();im.src=x.th;im.alt='Slide '+(i+1)+' of '+v.slides.length;im.loading='lazy';a.append(im);s.append(a)});c.append(s);
 const b=el('div','btns');const z=el('button','primary','Download all 8 slides (zip)');z.onclick=()=>zip(z,v);
 const t=el('button','','Copy TikTok caption');t.dataset.k='tt';t.onclick=()=>copy(t,v.tiktok);
 const i=el('button','','Copy Instagram caption');i.dataset.k='ig';i.onclick=()=>copy(i,v.insta);
 const ti=el('button','','Copy title');ti.dataset.k='ti';ti.onclick=()=>copy(ti,v.title);b.append(z,t,i,ti);c.append(b);
 c.append(el('p','hint','Slides are in posting order. On a phone, press and hold a slide to save it.'));
 for(const [k,l,tx] of [['tt','TikTok caption',v.tiktok],['ig','Instagram caption',v.insta],['ti','Title',v.title]]){const d=el('details');d.dataset.k=k;d.append(el('summary','',l),el('pre','',tx));c.append(d)}
 return c}
const days=[...new Set(VIDEOS.map(v=>v.date))];
const top=el('div');top.append(el('h1','','TripFlux weekly pack'),el('p','sub',VIDEOS.length?'Post the slides in order, then paste the caption. Twelve o’clock and six o’clock slots.':'Nothing queued.'));app.append(top);
if(!VIDEOS.length)app.append(el('p','empty','No videos in this pack.'));
days.forEach(d=>{const w=el('div','day');const h=el('h2','',fmt(d));if(d===lon)h.append(el('span','tag','Today'));else if(d>lon)h.append(el('span','tag','Next'));w.append(h);VIDEOS.filter(v=>v.date===d).forEach(v=>w.append(card(v)));app.append(w)});
</script>
